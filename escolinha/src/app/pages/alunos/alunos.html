<h2>Lista de Alunos</h2>

<p>
  <a routerLink="/cadastrar">Novo aluno</a>
</p>

@if(alunos.length === 0){
<p>Nenhum aluno cadastrado.</p>
} @else {
<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>E-mail</th>
      <th>Curso</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody>
    @for(aluno of alunos; track aluno.id){
    <tr>
      <td>{{ aluno.id }}</td>
      <td>{{ aluno.nome }}</td>
      <td>{{ aluno.email }}</td>
      <td>{{ aluno.curso }}</td>
      <td>
        <a [routerLink]="['/editar', aluno.id]">Editar</a> |
        <button (click)="excluir(aluno.id)">Excluir</button>
      </td>
    </tr>
    }
  </tbody>
</table>
}
