<div class="container">
  <h1 class="titulo-secao">Sobre nós</h1>
  <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Ipsam illo hic ex, officiis dolorem eum animi illum
    dolorum repellat similique velit quas sit vitae. Ut voluptate quo iure ducimus quia!</p>
  <form action="#" method="post">
    <fieldset>
      <legend>Entre em contato conosco!</legend>
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" placeholder="Digite seu nome" required>
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="voce@exemplo.com" required>
      </div>
      <div class="campo">
        <label for="nascimento">Nascimento</label>
        <input id="nascimento" name="nascimento" type="date">
      </div>
      <div class="campo">
        <label for="bio">Biografia</label>
        <textarea id="bio" name="bio" rows="6" maxlength="500"></textarea>
      </div>
    </fieldset>
    <div class="opcoes">
      <button class="botao" type="submit">Confirmar inscrição</button>
      <button class="botao secundario" type="reset">Limpar</button>
    </div>
  </form>
</div>
